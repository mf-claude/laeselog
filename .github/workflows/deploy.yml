name: Deploy to one.com

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          # './*' does not match dotfiles/dotdirs, so .git and .github
          # are skipped automatically without needing an exclude list.
          local_path: './*'
          remote_path: '/'
          sftp_only: true
          # Never deletes remote files that aren't in the repo, so
          # api/config.php and api/data.json on the server are preserved.
          delete_remote_files: false
