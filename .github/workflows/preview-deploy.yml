name: Preview deploy

on:
  push:
    branches:
      - 'feature/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Compute preview folder name
        id: branch
        run: echo "safe=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Write preview config.php
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          cat > api/config.php <<PHP
          <?php
          define('SITE_PASSWORD', '$SITE_PASSWORD');
          PHP

      - name: Deploy preview via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: webroots/www/laeselog/preview/${{ steps.branch.outputs.safe }}
        run: |
          lftp <<LFTP_SCRIPT
          set sftp:auto-confirm yes
          open -u "$SFTP_USERNAME","$SFTP_PASSWORD" sftp://$SFTP_HOST:22
          mkdir -p "$REMOTE_DIR"
          mirror --reverse --parallel=2 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            ./ "$REMOTE_DIR/"
          bye
          LFTP_SCRIPT
